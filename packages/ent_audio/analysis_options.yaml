# Self-contained, as pub.dev reads it: a published package has no parent directory to include from.
include: package:lints/recommended.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    curly_braces_in_flow_control_structures: true
