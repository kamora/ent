name: ent_audio
description: >-
  The audio backend of Ent Engine: plays the engine's Audio, PositionalAudio and AudioAnalyser through miniaudio,
  compiled into the app when it is built.
version: 0.1.0-dev.1
repository: https://github.com/kamora/ent/tree/master/packages/ent_audio
issue_tracker: https://github.com/kamora/ent/issues
platforms:
  android:
  ios:
  macos:
topics:
  - audio
  - game-engine

environment:
  sdk: ^3.13.5

dependencies:
  code_assets: ^2.2.0
  ent: ^0.1.0-dev.6
  ffi: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
