name: ent_renderer
description: >-
  The renderer core of Ent Engine, shared by its renderers: render lists, programs, uniforms, lights, shadows,
  environment maps and passes, written against a small GPU interface each renderer implements.
version: 0.1.0-dev.2
repository: https://github.com/kamora/ent/tree/master/packages/ent_renderer
issue_tracker: https://github.com/kamora/ent/issues
platforms:
  android:
  ios:
  macos:
topics:
  - graphics
  - rendering
  - game-engine

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  ent: ^0.1.0-dev.1
  ent_shaders: ^0.1.0-dev.2
  vector_math: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
