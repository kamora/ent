# Resolves ent, ent_flutter, ent_renderer and ent_shaders from this repository while developing; pub ignores this file
# when publishing.
dependency_overrides:
  ent:
    path: ../ent
  ent_flutter:
    path: ../ent_flutter
  ent_renderer:
    path: ../ent_renderer
  ent_shaders:
    path: ../ent_shaders
