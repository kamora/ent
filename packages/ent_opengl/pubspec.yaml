name: ent_opengl
description: >-
  The OpenGL ES renderer of Ent Engine: the shared renderer core drawing through OpenGL ES 3, on ANGLE (Metal) on
  macOS and on the system's OpenGL ES on Android.
version: 0.1.0-dev.4
repository: https://github.com/kamora/ent/tree/master/packages/ent_opengl
issue_tracker: https://github.com/kamora/ent/issues
platforms:
  android:
  macos:
topics:
  - graphics
  - rendering
  - opengl

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^2.2.0
  ent: ^0.1.0-dev.4
  ent_impeller: ^0.1.0-dev.1
  ent_renderer: ^0.1.0-dev.4
  ffi: ^2.1.0
  hooks: ^2.2.0
  vector_math: ^2.4.4
  wrangle: ^0.1.0-dev.1

flutter:
  plugin:
    platforms:
      android:
        package: vn.kamora.ent_opengl
        pluginClass: EntOpenGlPlugin
      macos:
        pluginClass: EntOpenGlPlugin
  assets:

    # The build hook writes this bundle when an app is built, so a published copy of the package has none yet.
    # ignore: asset_does_not_exist
    - build/shaderbundles/ent.shaderbundle

dev_dependencies:
  flutter_test:
    sdk: flutter
  ent_flutter: ^0.1.0-dev.2
  flutter_lints: ^6.0.0
  material_ui: ^1.11.1

# The shader variants this package's tests draw with: the parity scenes' registry of ent_flutter, for both renderers
# (the tests compare their frames).
hooks:
  user_defines:
    ent_opengl:
      shaders: ../ent_flutter/test/ent_shaders.json
    ent_flutter:
      shaders: ../ent_flutter/test/ent_shaders.json
