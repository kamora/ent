# Resolves ent, ent_impeller, ent_renderer and ent_shaders from this repository while developing; pub ignores this
# file when publishing.
dependency_overrides:
  ent:
    path: ../ent
  ent_impeller:
    path: ../ent_impeller
  ent_shaders:
    path: ../ent_shaders
  ent_renderer:
    path: ../ent_renderer
