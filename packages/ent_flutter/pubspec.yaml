name: ent_flutter
description: >-
  Ent Engine for Flutter: a 3D renderer on Flutter GPU (Impeller), with a scene widget, picking and orbit
  controls. Exports all of the ent engine.
version: 0.1.0-dev.1
topics:
  - graphics
  - rendering
  - impeller
  - flutter-gpu
  - game-engine

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  hooks: ^2.2.0
  ent: ^0.1.0-dev.1
  vector_math: ^2.4.4
  flat_buffers: ^25.9.23
  code_assets: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - build/shaderbundles/ent.shaderbundle

# The shader variants this package's own tests draw with.
hooks:
  user_defines:
    ent_flutter:
      shaders: test/ent_shaders.json
