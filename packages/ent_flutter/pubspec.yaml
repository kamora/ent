name: ent_flutter
description: >-
  Ent Engine for Flutter: a 3D renderer on Flutter GPU (Impeller), with a scene widget, picking and orbit
  controls. Exports all of the ent engine.
version: 0.1.0-dev.1
repository: https://github.com/kamora/ent/tree/master/packages/ent_flutter
issue_tracker: https://github.com/kamora/ent/issues
platforms:
  android:
  ios:
  macos:
topics:
  - graphics
  - rendering
  - impeller
  - flutter-gpu
  - game-engine

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  ent: ^0.1.0-dev.1
  ent_renderer: ^0.1.0-dev.1
  ent_shaders: ^0.1.0-dev.1
  vector_math: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gpu_shaders: ^0.5.2

# The shader variants this package's own tests draw with.
hooks:
  user_defines:
    ent_shaders:
      shaders: test/ent_shaders.json
