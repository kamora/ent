# Self-contained, as pub.dev reads it: a published package has no parent directory to include from.
include: package:lints/recommended.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    curly_braces_in_flow_control_structures: true

    # The public API keeps its established names (DEG2RAD, SRGBToLinear, ...), which these rules would rename.
    constant_identifier_names: false
    non_constant_identifier_names: false
