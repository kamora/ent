name: voxels
description: A voxel landscape to blast apart, drawn by ent_flutter's FlutterGpuRenderer.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  ent_audio: ^0.1.0-dev.1
  ent_flutter: ^0.1.0-dev.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The shader variants the scene draws with.
hooks:
  user_defines:
    ent_flutter:
      shaders: ent_shaders.json
