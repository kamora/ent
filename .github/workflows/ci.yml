# Checks every push to master and every pull request on macOS, the only desktop this release supports. Three jobs run
# side by side: the host checks (format, analysis, ent's and ent_shaders' tests, ent_flutter's flutter_tester suite),
# the Metal suites inside the example app, on the runner's GPU, and ent_opengl's checks, on ANGLE over that GPU.

name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      # The formatter reads page_width through analysis_options.yaml, whose include needs package:lints resolved;
      # without it, it falls back to 80 columns.
      - name: Resolve
        run: |
          (cd packages/ent && dart pub get)
          (cd packages/ent_shaders && dart pub get)
          (cd packages/ent_impeller && dart pub get)
          (cd packages/ent_audio && dart pub get)
          (cd packages/ent_renderer && flutter pub get)
          (cd packages/ent_flutter && flutter pub get)
          (cd examples/worm && flutter pub get)
          (cd examples/voxels && flutter pub get)
      - name: Format
        run: >-
          dart format --output=none --set-exit-if-changed packages/ent packages/ent_shaders packages/ent_impeller
          packages/ent_audio packages/ent_renderer packages/ent_flutter examples/worm examples/voxels
      - name: Analyze ent
        working-directory: packages/ent
        run: dart analyze --fatal-infos
      - name: ent tests
        working-directory: packages/ent
        run: dart test
      - name: Analyze ent_shaders
        working-directory: packages/ent_shaders
        run: dart analyze --fatal-infos
      - name: ent_shaders tests
        working-directory: packages/ent_shaders
        run: dart test
      - name: Analyze ent_impeller
        working-directory: packages/ent_impeller
        run: dart analyze --fatal-infos

      # Compiles ent_shaders' fixed shaders with the Flutter SDK's impellerc.
      - name: ent_impeller tests
        working-directory: packages/ent_impeller
        run: dart test
      - name: Analyze ent_audio
        working-directory: packages/ent_audio
        run: dart analyze --fatal-infos

      # Compares the graph with Chrome's renderings in fixtures/audio, and plays on the runner's output device if it
      # has one (device_test.dart skips otherwise).
      - name: ent_audio tests
        working-directory: packages/ent_audio
        run: dart test
      - name: Analyze ent_renderer
        working-directory: packages/ent_renderer
        run: flutter analyze --fatal-infos
      - name: ent_renderer tests
        working-directory: packages/ent_renderer
        run: flutter test
      - name: ent_flutter tests (Impeller on Vulkan through SwiftShader)
        working-directory: packages/ent_flutter
        run: flutter test --enable-impeller --enable-flutter-gpu
      - name: ent_flutter without Flutter GPU
        working-directory: packages/ent_flutter
        run: flutter test --enable-impeller test/disabled_test.dart
      - name: Analyze ent_flutter
        working-directory: packages/ent_flutter
        run: flutter analyze --fatal-infos
      - name: Analyze the example
        working-directory: examples/worm
        run: flutter analyze --fatal-infos
      - name: Analyze the voxels example
        working-directory: examples/voxels
        run: flutter analyze --fatal-infos

  metal:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples/worm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      # Device tests look for the shader bundle before the build hook makes it, so one build comes first.
      - name: Build once
        run: flutter build macos --debug
      - name: Metal parity suite
        run: flutter test integration_test/parity_metal_test.dart -d macos --enable-flutter-gpu
      - name: Getting started
        run: flutter test integration_test/getting_started_test.dart -d macos --enable-flutter-gpu
      - name: Viewer
        run: flutter test integration_test/viewer_test.dart -d macos --enable-flutter-gpu

  opengl:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/ent_opengl
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: Resolve
        run: |
          flutter pub get
          (cd ../../examples/cube && flutter pub get)
      - name: Format
        run: dart format --output=none --set-exit-if-changed . ../../examples/cube

      # The tests draw each scene on ANGLE and compare it with the reference frames; some of them also draw with
      # Flutter GPU, which runs on Vulkan through SwiftShader here.
      - name: ent_opengl tests
        run: flutter test --enable-impeller --enable-flutter-gpu
      - name: Analyze ent_opengl
        run: flutter analyze --fatal-infos
      - name: Analyze the example
        working-directory: examples/cube
        run: flutter analyze --fatal-infos

      # Device tests look for the shader bundle before the build hook makes it, so one build comes first.
      - name: Build the example once
        working-directory: examples/cube
        run: flutter build macos --debug
      - name: Backend in the app
        working-directory: examples/cube
        run: flutter test integration_test/backend_test.dart -d macos
      - name: Surface in the app
        working-directory: examples/cube
        run: flutter test integration_test/surface_test.dart -d macos
      - name: Parity in the app
        working-directory: examples/cube
        run: flutter test integration_test/parity_test.dart -d macos
